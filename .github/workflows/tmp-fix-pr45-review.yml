name: Temporary fix PR45 review findings

on:
  push:
    branches:
      - feat/remove-action-based-currency-rewards

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[pr45-review-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remove-action-based-currency-rewards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          types = Path('src/types.ts')
          text = types.read_text()
          text = replace_once(
              text,
              "  harvestedTypes?: string[];\n  user: {",
              "  harvestedTypes?: string[];\n  harvestInventory?: Record<string, number>;\n  user: {",
              'GameState harvest inventory',
          )
          types.write_text(text)

          app = Path('src/App.tsx')
          text = app.read_text()

          text = replace_once(
              text,
              "    harvestedTypes: [],\n    user: null,",
              "    harvestedTypes: [],\n    harvestInventory: {},\n    user: null,",
              'initial React state',
          )

          text, sync_count = re.subn(
              r"(?P<indent>\s*)harvestedTypes: data\.harvestedTypes \?\? prev\.harvestedTypes \?\? \[\],",
              lambda m: f"{m.group('indent')}harvestedTypes: data.harvestedTypes ?? prev.harvestedTypes ?? [],\n{m.group('indent')}harvestInventory: data.harvestInventory ?? prev.harvestInventory ?? {{}},",
              text,
          )
          if sync_count < 2:
              raise RuntimeError(f'expected at least two sync sites, found {sync_count}')

          text = replace_once(
              text,
              "          harvestedTypes: [],\n          createdAt: serverTimestamp()\n        };\n        setDoc(userDocRef, initialState).catch(e => handleFirestoreError(e, OperationType.WRITE, `users/${state.user!.uid}`));",
              "          harvestedTypes: [],\n          harvestInventory: {},\n          createdAt: serverTimestamp()\n        };\n        const batch = writeBatch(db);\n        batch.set(userDocRef, initialState);\n        batch.set(doc(db, 'system', 'global_stats'), { totalUsers: increment(1) }, { merge: true });\n        batch.commit().catch(e => handleFirestoreError(e, OperationType.WRITE, `users/${state.user!.uid}`));",
              'new-user atomic bookkeeping',
          )

          text = replace_once(
              text,
              "            harvestedTypes: updates.harvestedTypes ?? current.harvestedTypes,\n          };",
              "            harvestedTypes: updates.harvestedTypes ?? current.harvestedTypes,\n            harvestInventory: updates.harvestInventory ?? current.harvestInventory,\n          };",
              'guest persistence',
          )

          text = replace_once(
              text,
              "      let harvestedTypes = prev.harvestedTypes || [];\n      let isHarvestCleared = false;",
              "      let harvestedTypes = prev.harvestedTypes || [];\n      const harvestInventory = { ...(prev.harvestInventory ?? {}) };\n      let isHarvestCleared = false;",
              'harvest inventory accumulator',
          )

          text = replace_once(
              text,
              "        const harvestResult = applyHarvest(plant);\n        const cropDef = getCropDefinition(plant.cropId);",
              "        const harvestResult = applyHarvest(plant);\n        const cropDef = getCropDefinition(plant.cropId);\n        const outputId = cropDef?.harvest.itemId ?? plant.cropId ?? plant.type;\n        harvestInventory[outputId] = (harvestInventory[outputId] ?? 0) + harvestResult.yieldCount;",
              'harvest output storage',
          )

          text, state_count = re.subn(
              r"(\n\s*harvestedTypes,)(\s*\n\s*selectedPlantIndex: isHarvestCleared \? null : prev\.selectedPlantIndex)",
              r"\1\n        harvestInventory,\2",
              text,
              count=1,
          )
          if state_count != 1:
              raise RuntimeError('failed to add harvestInventory to nextState')

          text = replace_once(
              text,
              "      saveState({ orchards: newOrchards, credits, dataSeeds, harvestedTypes });",
              "      saveState({ orchards: newOrchards, credits, dataSeeds, harvestedTypes, harvestInventory });",
              'persist harvest inventory',
          )

          required = [
              'harvestInventory: data.harvestInventory',
              "batch.set(doc(db, 'system', 'global_stats'), { totalUsers: increment(1) }, { merge: true });",
              'harvestInventory[outputId] =',
          ]
          for token in required:
              if token not in text:
                  raise RuntimeError(f'missing final token: {token}')

          app.write_text(text)
          PY

          rm .github/workflows/tmp-fix-pr45-review.yml
          npm ci
          git diff --check
          npm test
          npm run lint
          npm run build

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types.ts src/App.tsx .github/workflows/tmp-fix-pr45-review.yml
          git commit -m 'Preserve harvest output and user counts [pr45-review-fixed]'
          git push origin HEAD:feat/remove-action-based-currency-rewards
