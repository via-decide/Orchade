name: Temporary fix PR45 review findings

on:
  push:
    branches:
      - feat/remove-action-based-currency-rewards

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[pr45-review-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remove-action-based-currency-rewards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add harvest inventory contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/types.ts'); t=p.read_text()
          old="  harvestedTypes?: string[];\n  user: {"
          assert old in t
          p.write_text(t.replace(old,"  harvestedTypes?: string[];\n  harvestInventory?: Record<string, number>;\n  user: {",1))
          PY

      - name: Persist harvest inventory through state sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx'); t=p.read_text()
          old="    harvestedTypes: [],\n    user: null,"
          assert old in t
          t=t.replace(old,"    harvestedTypes: [],\n    harvestInventory: {},\n    user: null,",1)
          old_line="            harvestedTypes: data.harvestedTypes ?? prev.harvestedTypes ?? [],"
          count=t.count(old_line)
          assert count >= 1
          t=t.replace(old_line,old_line+"\n            harvestInventory: data.harvestInventory ?? prev.harvestInventory ?? {},")
          old="            harvestedTypes: updates.harvestedTypes ?? current.harvestedTypes,\n          };"
          assert old in t
          t=t.replace(old,"            harvestedTypes: updates.harvestedTypes ?? current.harvestedTypes,\n            harvestInventory: updates.harvestInventory ?? current.harvestInventory,\n          };",1)
          p.write_text(t)
          PY

      - name: Preserve total user registration bookkeeping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx'); t=p.read_text()
          old="          harvestedTypes: [],\n          createdAt: serverTimestamp()\n        };\n        setDoc(userDocRef, initialState).catch(e => handleFirestoreError(e, OperationType.WRITE, `users/${state.user!.uid}`));"
          assert old in t
          new="          harvestedTypes: [],\n          harvestInventory: {},\n          createdAt: serverTimestamp()\n        };\n        const batch = writeBatch(db);\n        batch.set(userDocRef, initialState);\n        batch.set(doc(db, 'system', 'global_stats'), { totalUsers: increment(1) }, { merge: true });\n        batch.commit().catch(e => handleFirestoreError(e, OperationType.WRITE, `users/${state.user!.uid}`));"
          p.write_text(t.replace(old,new,1))
          PY

      - name: Store physical harvest yield
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx'); t=p.read_text()
          old="      let harvestedTypes = prev.harvestedTypes || [];\n      let isHarvestCleared = false;"
          assert old in t
          t=t.replace(old,"      let harvestedTypes = prev.harvestedTypes || [];\n      const harvestInventory = { ...(prev.harvestInventory ?? {}) };\n      let isHarvestCleared = false;",1)
          old="        const harvestResult = applyHarvest(plant);\n        const cropDef = getCropDefinition(plant.cropId);"
          assert old in t
          t=t.replace(old,"        const harvestResult = applyHarvest(plant);\n        const cropDef = getCropDefinition(plant.cropId);\n        const outputId = cropDef?.harvest.itemId ?? plant.cropId ?? plant.type;\n        harvestInventory[outputId] = (harvestInventory[outputId] ?? 0) + harvestResult.yieldCount;",1)
          old="        harvestedTypes, \n        selectedPlantIndex: isHarvestCleared ? null : prev.selectedPlantIndex \n      };\n      saveState({ orchards: newOrchards, credits, dataSeeds, harvestedTypes });"
          assert old in t
          t=t.replace(old,"        harvestedTypes,\n        harvestInventory,\n        selectedPlantIndex: isHarvestCleared ? null : prev.selectedPlantIndex \n      };\n      saveState({ orchards: newOrchards, credits, dataSeeds, harvestedTypes, harvestInventory });",1)
          p.write_text(t)
          PY

      - name: Install dependencies
        run: npm ci
      - name: Whitespace check
        run: git diff --check
      - name: Tests
        run: npm test
      - name: TypeScript lint
        run: npm run lint
      - name: Production build
        run: npm run build

      - name: Commit validated fixes and remove temporary workflow
        run: |
          rm .github/workflows/tmp-fix-pr45-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types.ts src/App.tsx .github/workflows/tmp-fix-pr45-review.yml
          git commit -m 'Preserve harvest output and user counts [pr45-review-fixed]'
          git push origin HEAD:feat/remove-action-based-currency-rewards
