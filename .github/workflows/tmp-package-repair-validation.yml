name: Temporary package manifest repair validation

on:
  push:
    branches:
      - fix/package-json-after-typescript7-merge

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[package-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/package-json-after-typescript7-merge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile from repaired manifest
        run: |
          rm -f package-lock.json
          npm install --package-lock-only
      - name: Clean install
        run: npm ci
      - name: Test suite
        run: npm test
      - name: TypeScript lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-package-repair-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/tmp-package-repair-validation.yml
          git commit -m 'Repair package manifest and lock after TypeScript 7 merge [package-repair]'
          git push origin HEAD:fix/package-json-after-typescript7-merge
