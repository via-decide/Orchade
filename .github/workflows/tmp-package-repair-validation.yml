name: Temporary package manifest repair validation

on:
  push:
    branches:
      - fix/package-json-after-typescript7-merge

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture npm ci diagnostics
        shell: bash
        run: |
          set +e
          npm ci > npm-ci.log 2>&1
          status=$?
          echo "npm_ci_exit=$status" > npm-ci-status.txt
          cat npm-ci.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: npm-ci-diagnostics
          path: |
            npm-ci.log
            npm-ci-status.txt
